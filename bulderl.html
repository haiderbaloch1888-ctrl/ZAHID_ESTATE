<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Viewer</title>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="bul.css">
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css">
</head>
<body>

<div class="page-wrapper">

    <!-- Image Gallery & Product Section Container -->
    <div class="content-container">
        
        <!-- Left Column: Gallery & Swiper -->
        <div class="gallery-section">
            <div class="main-display">
                <img id="main_image" src="za/h11.jfif" alt="Main Display">
            </div>

            <!-- Swiper Slider Section -->
            <div class="swiper-container-wrapper">
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img class="thumb" src="za/h1.jfif" alt="Thumbnail 1"></div>
                        <div class="swiper-slide"><img class="thumb" src="za/h2.jfif" alt="Thumbnail 2"></div>
                        <div class="swiper-slide"><img class="thumb" src="za/h3.jfif" alt="Thumbnail 3"></div>
                        <div class="swiper-slide"><img class="thumb" src="za/h4.jfif" alt="Thumbnail 4"></div>
                        <div class="swiper-slide"><img class="thumb" src="za/h5.jfif" alt="Thumbnail 5"></div>
                        <div class="swiper-slide"><img class="thumb" src="za/h6.jfif" alt="Thumbnail 6"></div>
                        <div class="swiper-slide"><img class="thumb" src="za/h7.jfif" alt="Thumbnail 7"></div>
                        <div class="swiper-slide"><img class="thumb" src="za/h8.jfif" alt="Thumbnail 8"></div>
                        <div class="swiper-slide"><img class="thumb" src="za/h9.jfif" alt="Thumbnail 9"></div>
                        <div class="swiper-slide"><img class="thumb" src="za/h10.jpeg" alt="Thumbnail 10"></div>
                    </div>
                    <div class="swiper-button-next
                    "></div>
                    <div class="swiper-button-prev"></div>
                </div>
            </div>
        </div>

        <!-- Right Column: Product Info Card -->
        <div class="product-info-card">
            <h2 class="product-title">Premium Quality House</h2>
            
            <!-- Rating Section -->
            <div class="product-rating">
                <span class="stars">★★★★☆</span>
                <span class="rating-count">(4.5 / 5.0 - 120 Reviews)</span>
            </div>

            <!-- Price & Discount Section -->
            <div class="pricing-section">
                <span class="original-price">$150,000</span>
                <span class="current-price">$9,900</span>
                <span class="discount-badge">34% OFF</span>
            </div>

            <!-- Rate / Unit Rate Section -->
            <div class="product-rate">
                Rate: 150,000 / piece
            </div>

            <!-- Warranty & Subscription Section -->
            <div class="warranty-subscription">
                <p class="warranty-text"><strong>2 Years Brand Warranty</strong> included</p>
                <p class="subscription-text"><strong>Monthly Refill Subscription Available</strong> (Save extra 10%)</p>
            </div>
        </div>

    </div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Gallery Interaction Script -->
<script>
$(document).ready(function(){
    $(".thumb").hover(function(){
        var newSrc = $(this).attr("src");
        $("#main_image").attr("src", newSrc);
    });

    $(".toggle-btn").click(function(){
        $("#main_image").toggle();
    });
});
</script>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

<!-- Initialize Swiper -->
<script>
    var swiper = new Swiper('.mySwiper', {
        slidesPerView: 4,
        spaceBetween: 10,
        loop: true,
        navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
        },
        autoplay: {
            delay: 3000,
            disableOnInteraction: false,
        },
        breakpoints: {
            320: { slidesPerView: 2 },
            768: { slidesPerView: 3 },
            1024: { slidesPerView: 4 }
        }
    });
</script>

</body>
</html>
